<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<title>مسار التخرج — مستشار التوجيه وتقييم الجاهزية | Graduation Pathway</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f4c5c'/%3E%3Cpath d='M32 12 L40 32 L32 28 L24 32 Z' fill='%23e36414'/%3E%3Cpath d='M32 52 L40 32 L32 36 L24 32 Z' fill='%23ffffff'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
:root{
  --primary:#0f4c5c; --primary-light:#156a7a; --accent:#e36414;
  --bg:#eef1f3; --card:#fff; --line:#dde3e7;
  --text:#23313a; --muted:#6b7d88;
  --good:#2e7d32; --mid:#b8860b; --bad:#c62828;
  --wa:#1faa53;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding-bottom:36px}

header{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:20px 20px 30px;position:relative}
.top-bar{max-width:1120px;margin:0 auto 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ver-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:700}
.lang-switch{display:inline-flex;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);border-radius:20px;padding:3px;gap:2px}
.lang-btn{border:none;background:transparent;color:#fff;padding:4px 12px;border-radius:16px;font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;transition:all .15s}
.lang-btn.active{background:#fff;color:var(--primary)}

.brand{display:flex;align-items:center;gap:18px;justify-content:center;flex-wrap:wrap;max-width:1120px;margin:0 auto}
.brand h1{font-size:1.68rem;letter-spacing:.3px}
.brand .en{font-size:.66rem;letter-spacing:4px;opacity:.7;margin:2px 0 5px}
.brand .tag{font-size:.88rem;opacity:.92}

/* شريط التنقل بين الأدوات الثلاث */
.tabs-wrap{max-width:1120px;margin:-18px auto 16px;padding:0 16px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--card);padding:6px;border-radius:14px;border:1px solid var(--line);box-shadow:0 4px 14px rgba(15,76,92,.09)}
.tab-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 12px;border:none;border-radius:10px;background:transparent;color:var(--muted);font:inherit;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .2s}
.tab-btn:hover{color:var(--primary);background:#f4f7f9}
.tab-btn.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(15,76,92,.25)}

.container{max-width:1120px;margin:0 auto;padding:0 16px}
.panel{display:none}
.panel.active{display:block}

.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}
.layout main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,42,67,.06)}
.card h2{font-size:1.02rem;color:var(--primary);border-inline-start:4px solid var(--accent);padding-inline-start:10px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:10px}
.field:last-child{margin-bottom:0}
.field label{font-size:.85rem;color:var(--muted);display:block;margin-bottom:4px;font-weight:600}
.field input[type=text],.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:.9rem;background:#fbfcfd;color:var(--text)}
.field textarea{min-height:86px;resize:vertical}

/* شرائح التقييم */
.crit{padding:13px 0;border-bottom:1px dashed var(--line)}
.crit:last-child{border-bottom:none}
.crit-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;background:#edf2f4;color:var(--primary);border-radius:50%;font-size:.78rem;font-weight:700;margin-inline-end:6px}
.crit-head .t{font-weight:700;font-size:.94rem}
.val{font-weight:800;font-size:.9rem;min-width:46px;text-align:end}
.val.good{color:var(--good)} .val.mid{color:var(--mid)} .val.bad{color:var(--bad)}
.desc{font-size:.84rem;color:var(--muted);margin:4px 0 6px}
input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
.anchor{font-size:.8rem;margin-top:4px;font-weight:600}
.anchor.good{color:var(--good)} .anchor.mid{color:var(--mid)} .anchor.bad{color:var(--bad)}

/* بطاقات التوجيه */
.q-group{margin-bottom:14px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.q-group:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.q-title{font-weight:700;font-size:.92rem;margin-bottom:8px;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:#f8fafb;color:var(--text);font:inherit;font-size:.84rem;font-weight:600;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--primary)}
.chip.selected{background:var(--primary);color:#fff;border-color:var(--primary)}

.track-card{background:#f7fafb;border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:10px;padding:13px 15px;margin-bottom:10px}
.track-card h3{font-size:.95rem;color:var(--primary);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.track-card .match{font-size:.75rem;background:#e6f4ea;color:#1b5e20;padding:2px 8px;border-radius:12px;white-space:nowrap}
.track-card p{font-size:.84rem;color:var(--muted);margin-bottom:6px}
.track-card .ex{font-size:.82rem;background:#fff;padding:7px 10px;border-radius:6px;border:1px solid #e6ecee;color:var(--text)}

/* لوحة النتائج */
.results{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.score-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.score-big{font-size:2.5rem;font-weight:800;line-height:1.1;color:var(--primary)}
.score-big small{font-size:1rem;color:var(--muted);font-weight:600}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:.76rem;padding:3px 9px;border-radius:20px;background:#f1f4f6;color:var(--muted)}
.pill b{font-weight:800}
.pill.g{background:#e6f4ea;color:#1b5e20}
.pill.m{background:#fdf3df;color:#8a6000}
.pill.b{background:#fdecea;color:#8e1f19}
.verdict{margin-top:10px;padding:10px 12px;border-radius:8px;font-weight:700;text-align:center;font-size:.92rem}
.verdict.good{background:#e6f4ea;color:#1b5e20}
.verdict.mid{background:#fff3e0;color:#8a5000}
.verdict.warn{background:#fff8e1;color:#7a6000}
.verdict.bad{background:#fdecea;color:#8e1f19}
.flag{margin-top:8px;padding:9px 12px;border-radius:8px;background:#fdecea;color:#8e1f19;font-size:.83rem;font-weight:600}
.verdict-msg{font-size:.84rem;color:var(--muted);text-align:center;margin-top:6px}
canvas{width:100%;max-width:340px;aspect-ratio:1;display:block;margin:10px auto 0}
.tips-title{font-size:.88rem;font-weight:700;margin:13px 0 7px;color:var(--primary)}
.tip{background:#fdf3ec;border-inline-start:3px solid var(--accent);padding:8px 10px;border-radius:6px;font-size:.83rem;margin-bottom:7px}
.tip b{color:#9a4a10}
.tip.ok{background:#e9f5ec;border-color:#4caf50}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font:inherit;font-size:.84rem;font-weight:600;color:var(--primary);text-decoration:none;transition:all .15s}
.btn:hover{border-color:var(--primary);background:#f7fafb}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#cf5810;border-color:#cf5810}
.btn.wa{background:var(--wa);color:#fff;border-color:var(--wa)}
.btn.wa:hover{background:#199447;border-color:#199447}
.note{font-size:.77rem;color:var(--muted);margin-top:10px;text-align:center}

.consult-flex{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.consult-info{flex:1;min-width:260px}
.consult-info p{font-size:.86rem;color:var(--muted);margin-bottom:10px}
.sug-box{background:#f8fafb;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px}
.sug-box .actions{margin-top:8px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#23313a;color:#fff;padding:10px 18px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .3s;z-index:99}
.toast.show{opacity:1}

footer{max-width:1120px;margin:14px auto 26px;padding:20px 16px;text-align:center;color:var(--muted);font-size:.88rem}
footer .fname{font-size:1.05rem;margin:6px 0 2px}
footer .fname b{color:var(--text)}
footer .ftitle{color:var(--primary);font-weight:600}
footer .fcontact{margin:8px 0}
footer a{color:var(--primary);text-decoration:none}
footer a:hover{text-decoration:underline}
footer .sep{margin:0 10px;opacity:.5}
footer .fnote{font-size:.78rem;margin-top:10px}

@media(max-width:860px){
  .layout{grid-template-columns:1fr}
  .results{position:static;max-height:none;overflow:visible}
  .tabs{grid-template-columns:1fr}
  .grid-2{grid-template-columns:1fr}
}
@media print{
  .no-print,.tabs-wrap,.top-bar,.sug-box{display:none!important}
  body{background:#fff;padding-bottom:0}
  .panel{display:none!important}
  .panel.active{display:block!important}
  .layout{display:block}
  .results{position:static;max-height:none;overflow:visible}
  .card{box-shadow:none;break-inside:avoid}
}
</style>
</head>

<header>

<div class="tabs-wrap no-print">

    if(typeof d.student==='string') appState.student=d.student;

    URBAN_CRIT.forEach(c=>{if(d.urban&&typeof d.urban[c.id]==='number') appState.urban[c.id]=d.urban[c.id];});

/* ==================== الرسم الراداري ==================== */
function drawRadar(cvs,criteria,scoresObj,color){
  const size=cvs.clientWidth; if(!size) return;
  const dpr=window.devicePixelRatio||1;
  cvs.width=size*dpr; cvs.height=size*dpr;
  const ctx=cvs.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const cx=size/2,cy=size/2,R=size/2-52,n=criteria.length;
  const ang=i=>-Math.PI/2+2*Math.PI*i/n;

  for(let r=1;r<=5;r++){
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const a=ang(i),rr=R*r/5;
      const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath();ctx.strokeStyle='#e0e7eb';ctx.stroke();
  }
  ctx.font='11px Tahoma,Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  criteria.forEach((c,i)=>{
    const a=ang(i);
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);
    ctx.strokeStyle='#d3dce1';ctx.stroke();
    ctx.fillStyle='#5d7180';
    ctx.fillText(c[appState.lang].short,cx+Math.cos(a)*(R+28),cy+Math.sin(a)*(R+28));
  });

  const vals=criteria.map(c=>scoresObj[c.id]);
  ctx.beginPath();
  vals.forEach((v,i)=>{
    const a=ang(i),rr=R*(v/10);
    const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  });
  ctx.closePath();
  ctx.fillStyle=color==='orange'?'rgba(227,100,20,.18)':'rgba(15,76,92,.18)';
  ctx.fill();
  ctx.strokeStyle=color==='orange'?'#e36414':'#0f4c5c';
  ctx.lineWidth=2;ctx.stroke();
  vals.forEach((v,i)=>{
    const a=ang(i),rr=R*(v/10);
    ctx.beginPath();ctx.arc(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,3.4,0,Math.PI*2);
    ctx.fillStyle=color==='orange'?'#e36414':'#0f4c5c';ctx.fill();
  });
}

function renderAdvisorQuestions(){
  const lang=appState.lang;
  $('advisorQuestions').innerHTML=ADVISOR_QUESTIONS.map(item=>`
    <div class="q-group">
      <div class="q-title">${esc(item[lang])}</div>
      <div class="chips" data-q="${item.q}">
        ${item.opts.map(o=>`<button type="button" class="chip ${appState.advisor[item.q]===o.val?'selected':''}" data-val="${o.val}">${esc(o[lang])}</button>`).join('')}
      </div>
    </div>
  `).join('');
}

function renderAdvisor(){
  const lang=appState.lang, L=UI[lang];
  const a=appState.advisor;
  const scored=TRACKS.map(tr=>{
    let pts=0;
    if(tr.scale===a.scale) pts+=40;
    if(tr.issue===a.issue) pts+=35;
    if(tr.skill===a.skill) pts+=25;
    return {...tr,pts:Math.min(98,Math.max(45,pts+20))};
  }).sort((x,y)=>y.pts-x.pts).slice(0,3);

  const methodTip=a.access==='field'?L.methodField:L.methodRemote;

  $('advisorResults').innerHTML=scored.map((tr,idx)=>`
    <div class="track-card">
      <h3><span>${idx+1}. ${esc(tr[lang].title)}</span><span class="match">${L.matchLbl} ${tr.pts}%</span></h3>
      <p>${esc(tr[lang].desc)}</p>
      <div class="ex">${esc(tr[lang].ex)}</div>
    </div>
  `).join('')+`<div class="tip"><b>${L.methodTitle}</b> ${methodTip}</div>`;
  updateConsult();
}

function buildSliders(containerId,criteria,scoresObj,groupKey){
  const lang=appState.lang;
  $(containerId).innerHTML=criteria.map((c,i)=>{
    const s=scoresObj[c.id],b=band(s),item=c[lang];
    return `<div class="crit">
      <div class="crit-head">
        <div><span class="num">${i+1}</span><span class="t">${esc(item.title)}</span></div>
        <span class="val ${b.cls}">${s}/10</span>
      </div>
      <p class="desc">${esc(item.desc)}</p>
      <input type="range" min="1" max="10" step="1" value="${s}" data-grp="${groupKey}" data-id="${c.id}">
      <p class="anchor ${b.cls}">${b.lbl} ${esc(item.anchors[b.i])}</p>
    </div>`;
  }).join('');
}

function updateReadiness(){
  const lang=appState.lang, L=UI[lang];
  const vals=READINESS_CRIT.map(c=>appState.readiness[c.id]);
  const total=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10);
  $('rTotal').textContent=total;
  $('rPillG').innerHTML=`${L.pillsR[0]}<b>${vals.filter(v=>v>=8).length}</b>`;
  $('rPillM').innerHTML=`${L.pillsR[1]}<b>${vals.filter(v=>v>=4&&v<=7).length}</b>`;
  $('rPillB').innerHTML=`${L.pillsR[2]}<b>${vals.filter(v=>v<=3).length}</b>`;

  let v=lang==='ar'
    ? {t:'جاهزية ممتازة للتسليم والتحكيم',c:'good',m:'ركّز الآن على المراجعة النهائية لتطابق اللوحات والتدرب على العرض الشفهي.'}
    : {t:'Excellent Readiness for Jury & Submission',c:'good',m:'Focus on final drawing coordination and rehearsing your oral presentation.'};
  if(total<55) v=lang==='ar'
    ? {t:'مرحلة التأسيس — يحتاج جهدًا مكثفًا',c:'bad',m:'أكمل المتطلبات الأساسية للتحليل والبرنامج قبل الانتقال للتفاصيل.'}
    : {t:'Early Stage — Needs Intensive Work',c:'bad',m:'Complete foundational site analysis and programming before moving to details.'};
  else if(total<70) v=lang==='ar'
    ? {t:'تقدّم جيد مع فجوات تحتاج استكمالًا',c:'warn',m:'أغلق البنود المتأخرة وفق خطة أسبوعية واضحة مع مشرفك.'}
    : {t:'Good Progress with Gaps to Close',c:'warn',m:'Address delayed items through a structured weekly plan with your advisor.'};
  else if(total<85) v=lang==='ar'
    ? {t:'قريب من الجاهزية الكاملة',c:'mid',m:'ارفع مستوى البنود المتوسطة لتصل إلى إخراج متكامل.'}
    : {t:'Near Full Readiness',c:'mid',m:'Elevate moderate items to achieve a cohesive, jury-ready package.'};

  $('rVerdict').textContent=v.t;
  $('rVerdict').className='verdict '+v.c;
  $('rMsg').textContent=v.m;

  const crit=READINESS_CRIT.filter(c=>appState.readiness[c.id]<=3);

  if(crit.length) $('rFlag').textContent=L.rFlagPrefix+crit.map(c=>c[lang].title+' ('+appState.readiness[c.id]+'/10)').join(lang==='ar'?'، ':', ');

  const weak=READINESS_CRIT.filter(c=>appState.readiness[c.id]<8).sort((a,b)=>appState.readiness[a.id]-appState.readiness[b.id]);

    : `<div class="tip ok">${L.rOk}</div>`;

  updateConsult();
}

  const lang=appState.lang, isAr=lang==='ar';
  const header=[];
  if(appState.student) header.push((isAr?'الطالب: ':'Student: ')+appState.student);
  if(appState.title) header.push((isAr?'المشروع/الموقع: ':'Project/Site: ')+appState.title);
  header.push((isAr?'التاريخ: ':'Date: ')+todayStr());

  if(appState.tab==='advisor'){
    const cards=[...$('advisorResults').querySelectorAll('.track-card h3 span:first-child')].map(el=>el.textContent);
    return [isAr?'مسار التخرج (النسخة 1.1) — توصيات توجيه المسار':'Graduation Pathway (v1.1) — Track Recommendations',...header,'',isAr?'المسارات المقترحة:':'Recommended Tracks:',...cards].join('\n');
  }
  if(appState.tab==='readiness'){
    const lines=[isAr?'مسار التخرج (النسخة 1.1) — تقييم جاهزية مشروع التخرج':'Graduation Pathway (v1.1) — Project Readiness Evaluation',...header,(isAr?'الإجمالي: ':'Total: ')+$('rTotal').textContent+'/100 — '+$('rVerdict').textContent,''];
    READINESS_CRIT.forEach(c=>lines.push('• '+c[lang].title+': '+appState.readiness[c.id]+'/10'));
    return lines.join('\n');
  }
  const lines=[isAr?'مسار التخرج (النسخة 1.1) — تشخيص الموقع / الحي الحضري':'Graduation Pathway (v1.1) — Site / Neighborhood Diagnosis',...header,(isAr?'الإجمالي: ':'Total: ')+$('uTotal').textContent+'/100 — '+$('uVerdict').textContent,''];
  URBAN_CRIT.forEach(c=>lines.push('• '+c[lang].title+': '+appState.urban[c.id]+'/10'));
  return lines.join('\n');
}

  const subj=(isAr?'استشارة مسار التخرج':'Graduation Pathway Consultation')+(appState.title?' — '+appState.title:'');
  $('waBtn').href='https://wa.me/971569758180?text='+encodeURIComponent(intro+txt);
  $('mailBtn').href='mailto:emohammedani@gmail.com?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(txt);

$('clearSugBtn').addEventListener('click',()=>{

function downloadHtmlReport(title, bodyHtml, fileSlug){
  const lang=appState.lang, isAr=lang==='ar', L=UI[lang];
  const metaHtml=isAr
    ? `<p><b>النسخة:</b> النسخة 1.1 &nbsp;|&nbsp; <b>الطالب / المجموعة:</b> ${esc(appState.student||'غير محدد')} &nbsp;|&nbsp; <b>المشروع / الموقع:</b> ${esc(appState.title||'غير محدد')} &nbsp;|&nbsp; <b>التاريخ:</b> ${todayStr()}</p>`
    : `<p><b>Version:</b> Version 1.1 &nbsp;|&nbsp; <b>Student / Group:</b> ${esc(appState.student||'Not specified')} &nbsp;|&nbsp; <b>Project / Site:</b> ${esc(appState.title||'Not specified')} &nbsp;|&nbsp; <b>Date:</b> ${todayStr()}</p>`;
  const ftr=isAr
    ? 'النسخة 1.1 — مسار التخرج: د. اعتزاز عبدالرحمن محمداني (أستاذ مساعد في العمارة وتخطيط المدن)'
    : 'Version 1.1 — Graduation Pathway: Dr. Eatezaz Abdelrahman Mohammedani (Assistant Professor of Architecture & Urban Planning)';
  const doc=`<!DOCTYPE html><html lang="${lang}" dir="${L.dir}"><head><meta charset="UTF-8"><title>${esc(title)}</title>
  <style>
    body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:#23313a;line-height:1.7;max-width:820px;margin:24px auto;padding:0 18px}
    .hdr{background:#0f4c5c;color:#fff;padding:18px 22px;border-radius:10px;margin-bottom:16px}
    .hdr h1{margin:0 0 6px;font-size:1.3rem}
    .hdr p{margin:0;font-size:.86rem;opacity:.9}
    .box{border:1px solid #dde3e7;border-radius:10px;padding:14px 18px;margin-bottom:14px}
    .box h2{margin:0 0 8px;font-size:1.02rem;color:#0f4c5c;border-inline-start:4px solid #e36414;padding-inline-start:8px}
    table{width:100%;border-collapse:collapse;font-size:.88rem}
    th,td{padding:8px 10px;border-bottom:1px solid #e4e9ec;text-align:start}
    th{background:#f5f8fa;color:#526470}
    .good{color:#2e7d32;font-weight:700} .mid{color:#b8860b;font-weight:700} .bad{color:#c62828;font-weight:700}
    .tip{background:#fdf3ec;border-inline-start:3px solid #e36414;padding:8px 10px;border-radius:6px;margin-bottom:6px;font-size:.86rem}
    .track-card{background:#f7fafb;border:1px solid #dde3e7;border-inline-start:4px solid #e36414;border-radius:8px;padding:10px 14px;margin-bottom:8px}
    .ftr{text-align:center;color:#6b7d88;font-size:.8rem;margin-top:20px;border-top:1px solid #e4e9ec;padding-top:12px}
  </style></head><body>
  <div class="hdr"><h1>${esc(title)}</h1>${metaHtml}</div>
  ${bodyHtml}
  <div class="ftr">${ftr}</div>
  </body></html>`;
  const blob=new Blob([doc],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=fileSlug+'.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(L.downloaded);
}

/* ==================== الأحداث والتشغيل ==================== */
function setTab(tabName){
  appState.tab=tabName;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tabName));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+tabName));
  if(tabName==='readiness') drawRadar($('rRadar'),READINESS_CRIT,appState.readiness,'orange');
  if(tabName==='urban') drawRadar($('uRadar'),URBAN_CRIT,appState.urban,'teal');
  updateConsult(); save();
}

document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click',()=>setTab(btn.dataset.tab)));
document.querySelectorAll('.lang-btn').forEach(btn=>btn.addEventListener('click',()=>{
  appState.lang=btn.dataset.lang;
  applyLanguage(); save();
}));

document.addEventListener('click',e=>{
  const chip=e.target.closest('.chip');
  if(chip){
    const q=chip.closest('.chips').dataset.q;
    appState.advisor[q]=chip.dataset.val;
    renderAdvisorQuestions();
    renderAdvisor(); save();
  }
});

document.addEventListener('input',e=>{
  if(e.target.id==='studentName'){appState.student=e.target.value; updateConsult(); save();}
  else if(e.target.id==='projectTitle'){appState.title=e.target.value; updateConsult(); save();}
  else if(e.target.id==='suggestionText'){appState.suggestion=e.target.value; save();}
  else if(e.target.type==='range'&&e.target.dataset.grp){
    const grp=e.target.dataset.grp, id=e.target.dataset.id, v=+e.target.value;
    appState[grp][id]=v;
    const row=e.target.closest('.crit');
    const b=band(v);
    const valEl=row.querySelector('.val');
    valEl.textContent=v+'/10'; valEl.className='val '+b.cls;
    const critObj=(grp==='readiness'?READINESS_CRIT:URBAN_CRIT).find(x=>x.id===id);
    const ancEl=row.querySelector('.anchor');
    ancEl.className='anchor '+b.cls;
    ancEl.textContent=b.lbl+' '+critObj[appState.lang].anchors[b.i];
    if(grp==='readiness') updateReadiness(); else updateUrban();
    save();
  }
});

function copyText(txt){
  const L=UI[appState.lang];
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast(L.copied)).catch(()=>toast(L.copyErr));
  } else toast(L.copyErr);
}

$('copyAdvisorBtn').addEventListener('click',()=>copyText(getActiveSummary()));
$('copyReadinessBtn').addEventListener('click',()=>copyText(getActiveSummary()));
$('copyUrbanBtn').addEventListener('click',()=>copyText(getActiveSummary()));

window.addEventListener('resize',()=>{

function resetDefaults(){
  appState.student='';
  appState.title='';
  appState.suggestion='';
  appState.advisor={scale:'building',issue:'climate',skill:'form',access:'field'};
  READINESS_CRIT.forEach(c=>appState.readiness[c.id]=6);
  URBAN_CRIT.forEach(c=>appState.urban[c.id]=5);
  $('studentName').value='';
  $('projectTitle').value='';
  $('suggestionText').value='';
  applyLanguage();
  save();
}
